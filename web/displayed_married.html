<!DOCTYPE html>
<html>
<head>
    <title>Display Married Agents</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="container">

    <h1>Display Married Agents</h1>

    <p>
        Select the criteria below to display married field agents.
    </p>

    <form action="DisplayMarriedAndGenderServlet.do" method="GET">

        <label for="gender">Gender</label>

        <select id="gender" name="gender">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>

        <label for="marital">Marital Status</label>

        <select id="marital" name="marital">
            <option value="Married">Married</option>
        </select>

        <input type="submit" value="Display Agents">

    </form>

    <a href="menu.html" class="button back">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
