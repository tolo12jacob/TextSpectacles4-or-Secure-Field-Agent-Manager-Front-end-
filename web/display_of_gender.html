<!DOCTYPE html>
<html>
<head>
    <title>Display Agents by Gender</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="container">

    <h1>Display Agents by Gender</h1>

    <p>
        Select a gender below to display all matching field agents.
    </p>

    <form action="DisplaySpecificGenderServlet.do" method="GET">

        <label for="gender">Gender</label>

        <select id="gender" name="gender">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>

        <input type="submit" value="Display Agents">

    </form>

    <a href="menu.html" class="button back">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
